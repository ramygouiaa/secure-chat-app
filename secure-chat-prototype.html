<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SecureChat - Encrypted Messaging</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      .message-bubble {
        max-width: 70%;
        word-wrap: break-word;
      }
      .typing-indicator {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .typing-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background-color: #6b7280;
        animation: typing 1.4s infinite ease-in-out;
      }
      .typing-dot:nth-child(1) {
        animation-delay: -0.32s;
      }
      .typing-dot:nth-child(2) {
        animation-delay: -0.16s;
      }
      @keyframes typing {
        0%,
        80%,
        100% {
          transform: scale(0.8);
          opacity: 0.5;
        }
        40% {
          transform: scale(1);
          opacity: 1;
        }
      }
    </style>
  </head>
  <body class="bg-gray-900 text-white">
    <div class="flex h-screen">
      <!-- Sidebar -->
      <div class="w-80 bg-gray-800 border-r border-gray-700 flex flex-col">
        <!-- Header -->
        <div class="p-4 border-b border-gray-700">
          <div class="flex items-center justify-between">
            <h1 class="text-xl font-bold text-green-400">SecureChat</h1>
            <div class="flex items-center gap-2">
              <div
                class="w-3 h-3 bg-green-500 rounded-full"
                title="E2E Encryption Active"
              ></div>
              <button
                id="voiceObfuscationBtn"
                class="px-3 py-1 bg-purple-600 hover:bg-purple-700 rounded text-sm"
              >
                🎭 Voice Mode
              </button>
            </div>
          </div>
        </div>

        <!-- Key Exchange Status -->
        <div class="p-3 bg-gray-700 border-b border-gray-600">
          <div class="flex items-center gap-2 text-sm">
            <span class="text-green-400">🔐</span>
            <span id="keyStatus" class="text-green-400">Keys Generated</span>
          </div>
        </div>

        <!-- Contacts -->
        <div class="flex-1 overflow-y-auto">
          <div class="p-2">
            <div class="text-sm text-gray-400 mb-2">Contacts</div>
            <div id="contactsList" class="space-y-1">
              <!-- Contacts will be populated here -->
            </div>
          </div>
        </div>
      </div>

      <!-- Main Chat Area -->
      <div class="flex-1 flex flex-col">
        <!-- Chat Header -->
        <div class="p-4 bg-gray-800 border-b border-gray-700">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-3">
              <div
                class="w-10 h-10 bg-blue-500 rounded-full flex items-center justify-center"
              >
                <span class="text-white font-semibold">A</span>
              </div>
              <div>
                <div class="font-medium">Alice</div>
                <div class="text-sm text-gray-400">
                  Online • End-to-end encrypted
                </div>
                <div id="callStatus" class="text-xs text-green-400"></div>
              </div>
            </div>
            <div class="flex items-center gap-2">
              <button
                id="voiceCallBtn"
                class="p-2 hover:bg-gray-700 rounded"
                title="Start Voice Call"
              >
                🎤
              </button>
              <button
                id="videoCallBtn"
                class="p-2 hover:bg-gray-700 rounded"
                title="Establish P2P Connection"
              >
                🔗
              </button>
            </div>
          </div>
        </div>

        <!-- Messages -->
        <div
          id="messagesContainer"
          class="flex-1 overflow-y-auto p-4 space-y-4"
        >
          <!-- Messages will be populated here -->
        </div>

        <!-- Voice Obfuscation Controls -->
        <div
          id="voiceControls"
          class="hidden p-3 bg-purple-900 border-t border-purple-700"
        >
          <div class="flex items-center gap-4">
            <label class="text-sm">Voice Obfuscation:</label>
            <select
              id="voiceEffect"
              class="bg-gray-800 text-white px-3 py-1 rounded"
            >
              <option value="none">None</option>
              <option value="pitch">Pitch Shift</option>
              <option value="robot">Robot Voice</option>
              <option value="whisper">Whisper</option>
            </select>
            <button
              id="testVoiceBtn"
              class="px-3 py-1 bg-purple-600 hover:bg-purple-700 rounded text-sm"
            >
              Test Voice
            </button>
          </div>
        </div>

        <!-- Message Input -->
        <div class="p-4 bg-gray-800 border-t border-gray-700">
          <div class="flex items-center gap-2">
            <input
              type="text"
              id="messageInput"
              placeholder="Type a secure message..."
              class="flex-1 bg-gray-700 text-white px-4 py-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500"
            />
            <button
              id="sendBtn"
              class="px-4 py-2 bg-green-600 hover:bg-green-700 rounded-lg"
            >
              Send
            </button>
          </div>
        </div>
      </div>
    </div>

    <script>
      let socket = null;
      let clientId = null;

      function connectToSignalingServer() {
        socket = new WebSocket("ws://localhost:3000");

        socket.onopen = () => console.log("Connected to signaling server");

        socket.onmessage = async (event) => {
          const message = JSON.parse(event.data);
          if (message.type === "init") {
            clientId = message.id;
            console.log("Assigned client ID:", clientId);
          } else if (message.type === "offer") {
            await webrtc.handleOffer(message.data);
          } else if (message.type === "answer") {
            await webrtc.handleAnswer(message.data);
          } else if (message.type === "ice-candidate") {
            try {
              await webrtc.localConnection.addIceCandidate(message.data);
            } catch (e) {
              console.error("Failed to add ICE candidate:", e);
            }
          }
        };

        socket.onerror = (err) => console.error("WebSocket error:", err);
      }

      // WebRTC Peer-to-Peer Connection Manager
      class WebRTCManager {
        constructor() {
          this.localConnection = null;
          this.remoteConnection = null;
          this.dataChannel = null;
          this.localStream = null;
          this.remoteStream = null;
          this.isConnected = false;
          this.isCallActive = false;
          this.configuration = {
            iceServers: [
              { urls: "stun:stun.l.google.com:19302" },
              {
                urls: "turn:openrelay.metered.ca:80",
                username: "openrelayproject",
                credential: "openrelayproject",
              },
            ],
          };
        }

        async initializeConnection() {
          try {
            this.localConnection = new RTCPeerConnection(this.configuration);
            this.setupConnectionEventListeners();

            // Create data channel for secure messaging
            this.dataChannel = this.localConnection.createDataChannel(
              "secureMessages",
              {
                ordered: true,
              }
            );
            this.setupDataChannelListeners();

            console.log("WebRTC connection initialized");
            this.updateConnectionStatus("Initialized");
          } catch (error) {
            console.error("Failed to initialize WebRTC:", error);
            this.updateConnectionStatus("Failed to initialize");
          }
        }

        setupConnectionEventListeners() {
          this.localConnection.onicecandidate = (event) => {
            if (event.candidate) {
              console.log("ICE candidate:", event.candidate);
              // In a real app, send this to the remote peer via signaling server
              this.simulateSignaling("ice-candidate", event.candidate);
            }
          };

          this.localConnection.onconnectionstatechange = () => {
            console.log(
              "Connection state:",
              this.localConnection.connectionState
            );
            this.updateConnectionStatus(this.localConnection.connectionState);

            if (this.localConnection.connectionState === "connected") {
              this.isConnected = true;
              this.updateConnectionStatus("🔗 P2P Connected");
            }
          };

          this.localConnection.ondatachannel = (event) => {
            const channel = event.channel;
            this.setupDataChannelListeners(channel);
          };

          this.localConnection.ontrack = (event) => {
            console.log("Remote stream received");
            this.remoteStream = event.streams[0];
            this.handleRemoteStream(event.streams[0]);
          };
        }

        setupDataChannelListeners(channel = this.dataChannel) {
          channel.onopen = () => {
            console.log("Data channel opened");
            this.updateConnectionStatus("🔗 P2P Ready");
          };

          channel.onmessage = (event) => {
            console.log("P2P message received:", event.data);
            this.handleP2PMessage(event.data);
          };

          channel.onclose = () => {
            console.log("Data channel closed");
            this.updateConnectionStatus("Disconnected");
          };
        }

        async createOffer() {
          try {
            const offer = await this.localConnection.createOffer();
            await this.localConnection.setLocalDescription(offer);
            console.log("Offer created:", offer);

            // In a real app, send this offer to the remote peer
            this.simulateSignaling("offer", offer);
            this.updateConnectionStatus("Offer sent");
          } catch (error) {
            console.error("Failed to create offer:", error);
          }
        }

        async handleOffer(offer) {
          try {
            await this.localConnection.setRemoteDescription(offer);
            const answer = await this.localConnection.createAnswer();
            await this.localConnection.setLocalDescription(answer);

            console.log("Answer created:", answer);
            this.simulateSignaling("answer", answer);
          } catch (error) {
            console.error("Failed to handle offer:", error);
          }
        }

        async handleAnswer(answer) {
          try {
            await this.localConnection.setRemoteDescription(answer);
            console.log("Answer handled successfully");
          } catch (error) {
            console.error("Failed to handle answer:", error);
          }
        }

        async startVoiceCall() {
          try {
            this.localStream = await navigator.mediaDevices.getUserMedia({
              audio: true,
              video: false,
            });

            // Add local stream to connection
            this.localStream.getTracks().forEach((track) => {
              this.localConnection.addTrack(track, this.localStream);
            });

            this.isCallActive = true;
            this.updateCallStatus("📞 Voice call active");

            // Create offer after adding media
            await this.createOffer();
          } catch (error) {
            console.error("Failed to start voice call:", error);
            this.updateCallStatus("❌ Microphone access denied");
          }
        }

        stopVoiceCall() {
          if (this.localStream) {
            this.localStream.getTracks().forEach((track) => {
              track.stop();
            });
            this.localStream = null;
          }

          this.isCallActive = false;
          this.updateCallStatus("Call ended");
        }

        sendP2PMessage(message) {
          if (this.dataChannel && this.dataChannel.readyState === "open") {
            this.dataChannel.send(
              JSON.stringify({
                type: "secure-message",
                data: message,
                timestamp: Date.now(),
              })
            );
            return true;
          }
          return false;
        }

        handleP2PMessage(data) {
          try {
            const message = JSON.parse(data);
            if (message.type === "secure-message") {
              // Handle incoming P2P message
              const messageObj = {
                id: Date.now(),
                text: message.data,
                sender: currentContact,
                timestamp: new Date(message.timestamp),
                encrypted: true,
                p2p: true,
              };
              messages.push(messageObj);
              renderMessages();
            }
          } catch (error) {
            console.error("Failed to handle P2P message:", error);
          }
        }

        handleRemoteStream(stream) {
          // In a real app, you'd play this through an audio element
          console.log("Remote audio stream received");
          this.updateCallStatus("🔊 Receiving audio");
        }

        // Simulate signaling for demo (in real app, this would be through a server)
        simulateSignaling(type, data) {
          if (!socket || socket.readyState !== WebSocket.OPEN) return;
          const payload = {
            type,
            data,
            target: currentTargetId, // <-- make this dynamic
          };
          socket.send(JSON.stringify(payload));
        }

        updateConnectionStatus(status) {
          const statusElement = document.getElementById("keyStatus");
          if (statusElement) {
            statusElement.textContent = status;
          }
        }

        updateCallStatus(status) {
          const callStatusElement = document.getElementById("callStatus");
          if (callStatusElement) {
            callStatusElement.textContent = status;
          }
        }
      }

      // Crypto utilities
      class SecureCrypto {
        constructor() {
          this.keyPair = null;
          this.sharedKey = null;
          this.init();
        }

        async init() {
          await this.generateKeyPair();
          await this.generateSharedKey();
          document.getElementById("keyStatus").textContent = "Keys Generated";
        }

        async generateKeyPair() {
          this.keyPair = await window.crypto.subtle.generateKey(
            {
              name: "RSA-OAEP",
              modulusLength: 2048,
              publicExponent: new Uint8Array([1, 0, 1]),
              hash: "SHA-256",
            },
            true,
            ["encrypt", "decrypt"]
          );
        }

        async generateSharedKey() {
          this.sharedKey = await window.crypto.subtle.generateKey(
            {
              name: "AES-GCM",
              length: 256,
            },
            true,
            ["encrypt", "decrypt"]
          );
        }

        async encryptMessage(message) {
          const encoder = new TextEncoder();
          const data = encoder.encode(message);
          const iv = window.crypto.getRandomValues(new Uint8Array(12));

          const encrypted = await window.crypto.subtle.encrypt(
            {
              name: "AES-GCM",
              iv: iv,
            },
            this.sharedKey,
            data
          );
          console.log("Message encrypted:", encrypted);

          return {
            encrypted: Array.from(new Uint8Array(encrypted)),
            iv: Array.from(iv),
          };
        }

        async decryptMessage(encryptedData, iv) {
          const decrypted = await window.crypto.subtle.decrypt(
            {
              name: "AES-GCM",
              iv: new Uint8Array(iv),
            },
            this.sharedKey,
            new Uint8Array(encryptedData)
          );
          console.log("Message decrypted:", decrypted);

          const decoder = new TextDecoder();
          return decoder.decode(decrypted);
        }
      }

      // Voice obfuscation
      class VoiceObfuscator {
        constructor() {
          this.audioContext = null;
          this.isRecording = false;
          this.currentEffect = "none";
        }

        async init() {
          this.audioContext = new (window.AudioContext ||
            window.webkitAudioContext)();
        }

        applyEffect(audioBuffer, effect) {
          const channelData = audioBuffer.getChannelData(0);

          switch (effect) {
            case "pitch":
              // Simple pitch shifting (basic implementation)
              for (let i = 0; i < channelData.length; i += 2) {
                channelData[i] = channelData[i] * 0.8;
              }
              break;
            case "robot":
              // Robot voice effect
              for (let i = 0; i < channelData.length; i++) {
                channelData[i] = Math.sign(channelData[i]) * 0.3;
              }
              break;
            case "whisper":
              // Whisper effect
              for (let i = 0; i < channelData.length; i++) {
                channelData[i] =
                  channelData[i] * 0.3 + (Math.random() - 0.5) * 0.1;
              }
              break;
          }

          return audioBuffer;
        }
      }

      // App state
      const crypto = new SecureCrypto();
      const voiceObfuscator = new VoiceObfuscator();
      const webrtc = new WebRTCManager();
      let messages = [];
      let currentContact = "Alice";
      let voiceObfuscationActive = false;

      // DOM elements
      const messageInput = document.getElementById("messageInput");
      const sendBtn = document.getElementById("sendBtn");
      const messagesContainer = document.getElementById("messagesContainer");
      const voiceObfuscationBtn = document.getElementById(
        "voiceObfuscationBtn"
      );
      const voiceControls = document.getElementById("voiceControls");
      const voiceEffect = document.getElementById("voiceEffect");
      const testVoiceBtn = document.getElementById("testVoiceBtn");

      // Initialize
      async function init() {
        await voiceObfuscator.init();
        connectToSignalingServer();
        await webrtc.initializeConnection();
        setupEventListeners();
        loadDemoMessages();
        populateContacts();
      }

      function setupEventListeners() {
        sendBtn.addEventListener("click", sendMessage);
        messageInput.addEventListener("keypress", (e) => {
          if (e.key === "Enter") sendMessage();
        });

        voiceObfuscationBtn.addEventListener("click", toggleVoiceObfuscation);
        testVoiceBtn.addEventListener("click", testVoiceEffect);

        // WebRTC voice call buttons
        document
          .getElementById("voiceCallBtn")
          .addEventListener("click", toggleVoiceCall);
        document
          .getElementById("videoCallBtn")
          .addEventListener("click", initP2PConnection);

        voiceEffect.addEventListener("change", (e) => {
          voiceObfuscator.currentEffect = e.target.value;
        });
      }

      async function sendMessage() {
        const message = messageInput.value.trim();
        if (!message) return;

        const messageObj = {
          id: Date.now(),
          text: message,
          sender: "You",
          timestamp: new Date(),
          encrypted: true,
          p2p: false,
        };

        // Try to send via P2P first
        if (webrtc.isConnected && webrtc.sendP2PMessage(message)) {
          messageObj.p2p = true;
          console.log("Message sent via P2P");
        } else {
          // Fallback to encrypted message
          const encryptedData = await crypto.encryptMessage(message);
          messageObj.encryptedData = encryptedData;
          console.log("Message sent via encrypted channel");
        }

        messages.push(messageObj);
        renderMessages();
        messageInput.value = "";

        // Simulate response only if not P2P
        if (!messageObj.p2p) {
          setTimeout(() => {
            simulateResponse();
          }, 1000);
        }
      }

      async function simulateResponse() {
        const responses = [
          "Thanks for the secure message!",
          "This encryption is working great 🔐",
          "Voice obfuscation mode is so cool!",
          "Our conversation is completely private",
          "End-to-end encryption active ✅",
        ];

        const response =
          responses[Math.floor(Math.random() * responses.length)];
        const messageObj = {
          id: Date.now(),
          text: response,
          sender: currentContact,
          timestamp: new Date(),
          encrypted: true,
        };

        messages.push(messageObj);
        renderMessages();
      }

      function renderMessages() {
        messagesContainer.innerHTML = messages
          .map(
            (msg) => `
                <div class="flex ${
                  msg.sender === "You" ? "justify-end" : "justify-start"
                }">
                    <div class="message-bubble px-4 py-2 rounded-lg ${
                      msg.sender === "You"
                        ? "bg-green-600 text-white"
                        : "bg-gray-700 text-white"
                    }">
                        <div class="text-sm">${msg.text}</div>
                        <div class="text-xs opacity-70 mt-1 flex items-center gap-1">
                            ${msg.encrypted ? "🔒" : ""} 
                            ${msg.p2p ? "🔗" : ""}
                            ${msg.timestamp.toLocaleTimeString([], {
                              hour: "2-digit",
                              minute: "2-digit",
                            })}
                        </div>
                    </div>
                </div>
            `
          )
          .join("");

        messagesContainer.scrollTop = messagesContainer.scrollHeight;
      }

      function toggleVoiceObfuscation() {
        voiceObfuscationActive = !voiceObfuscationActive;
        voiceControls.classList.toggle("hidden");
        voiceObfuscationBtn.textContent = voiceObfuscationActive
          ? "🎭 Voice ON"
          : "🎭 Voice Mode";
        voiceObfuscationBtn.className = voiceObfuscationActive
          ? "px-3 py-1 bg-purple-500 hover:bg-purple-600 rounded text-sm"
          : "px-3 py-1 bg-purple-600 hover:bg-purple-700 rounded text-sm";
      }

      function testVoiceEffect() {
        alert(
          `Testing ${voiceEffect.value} voice effect! 🎤\n(Voice processing would happen here)`
        );
      }

      async function toggleVoiceCall() {
        if (webrtc.isCallActive) {
          webrtc.stopVoiceCall();
          document.getElementById("voiceCallBtn").textContent = "🎤";
        } else {
          await webrtc.startVoiceCall();
          document.getElementById("voiceCallBtn").textContent = "🔴";
        }
      }

      async function initP2PConnection() {
        if (!webrtc.isConnected) {
          await webrtc.createOffer();
          document.getElementById("videoCallBtn").textContent = "🔗";
        } else {
          alert("P2P connection already established! 🔗");
        }
      }

      function loadDemoMessages() {
        messages = [
          {
            id: 1,
            text: "Hey! Welcome to SecureChat - everything here is end-to-end encrypted! 🔐",
            sender: "Alice",
            timestamp: new Date(Date.now() - 10000),
            encrypted: true,
          },
          {
            id: 2,
            text: "Amazing! I can see the encryption status indicator. How secure is this?",
            sender: "You",
            timestamp: new Date(Date.now() - 5000),
            encrypted: true,
          },
          {
            id: 3,
            text: "Super secure! We use AES-256-GCM encryption with RSA key exchange. Even if someone intercepts our messages, they can't read them! 🛡️",
            sender: "Alice",
            timestamp: new Date(Date.now() - 2000),
            encrypted: true,
          },
        ];
        renderMessages();
      }

      function populateContacts() {
        const contacts = [
          { name: "Alice", status: "online", avatar: "A" },
          { name: "Bob", status: "away", avatar: "B" },
          { name: "Charlie", status: "offline", avatar: "C" },
        ];

        const contactsList = document.getElementById("contactsList");
        contactsList.innerHTML = contacts
          .map(
            (contact) => `
                <div class="flex items-center gap-3 p-2 hover:bg-gray-700 rounded cursor-pointer ${
                  contact.name === currentContact ? "bg-gray-700" : ""
                }">
                    <div class="w-8 h-8 ${
                      contact.name === "Alice"
                        ? "bg-blue-500"
                        : contact.name === "Bob"
                        ? "bg-green-500"
                        : "bg-purple-500"
                    } rounded-full flex items-center justify-center">
                        <span class="text-white text-sm">${
                          contact.avatar
                        }</span>
                    </div>
                    <div class="flex-1">
                        <div class="text-sm font-medium">${contact.name}</div>
                        <div class="text-xs text-gray-400">${
                          contact.status
                        }</div>
                    </div>
                    <div class="w-2 h-2 ${
                      contact.status === "online"
                        ? "bg-green-500"
                        : contact.status === "away"
                        ? "bg-yellow-500"
                        : "bg-gray-500"
                    } rounded-full"></div>
                </div>
            `
          )
          .join("");
      }

      // Initialize app
      init();
    </script>
  </body>
</html>
