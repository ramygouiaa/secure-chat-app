
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SecureChat - Full Messaging</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white">
  <div class="flex h-screen">
    <!-- Sidebar -->
    <div class="w-80 bg-gray-800 border-r border-gray-700 flex flex-col">
      <div class="p-4 border-b border-gray-700">
        <div class="flex items-center justify-between">
          <h1 class="text-xl font-bold text-green-400">SecureChat</h1>
          <div class="flex items-center gap-2">
            <div class="w-3 h-3 bg-green-500 rounded-full" title="E2E Encryption Active"></div>
          </div>
        </div>
      </div>
      <div class="p-3 bg-gray-700 border-b border-gray-600">
        <div class="flex items-center gap-2 text-sm">
          <span class="text-green-400">🔐</span>
          <span id="keyStatus" class="text-green-400">Initializing...</span>
        </div>
        <div id="clientIdDisplay" class="text-xs text-gray-400 mt-2"></div>
      </div>
      <div class="flex-1 overflow-y-auto">
        <div class="p-2">
          <div class="text-sm text-gray-400 mb-2">Contacts</div>
          <div id="contactsList" class="space-y-1"></div>
        </div>
      </div>
    </div>

    <!-- Main Chat Area -->
    <div class="flex-1 flex flex-col">
      <div class="p-4 bg-gray-800 border-b border-gray-700">
        <div class="flex items-center justify-between">
          <div class="font-medium">Chat Area</div>
          <div class="text-sm text-gray-400" id="connectionStatus">Disconnected</div>
        </div>
      </div>

      <!-- Messages -->
      <div id="messagesContainer" class="flex-1 overflow-y-auto p-4 space-y-4"></div>

      <!-- Message Input -->
      <div class="p-4 bg-gray-800 border-t border-gray-700">
        <div class="flex items-center gap-2">
          <input type="text" id="messageInput" placeholder="Type a secure message..."
            class="flex-1 bg-gray-700 text-white px-4 py-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500"/>
          <button id="sendBtn" class="px-4 py-2 bg-green-600 hover:bg-green-700 rounded-lg">Send</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let socket = null;
    let clientId = null;
    let currentTargetId = null;
    let peers = {};
    let dataChannel = null;
    let localConnection = null;
    let messages = [];

    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const messagesContainer = document.getElementById('messagesContainer');
    const contactsList = document.getElementById('contactsList');
    const connectionStatus = document.getElementById('connectionStatus');

    function connectToSignalingServer() {
      socket = new WebSocket('ws://localhost:3000');

      socket.onopen = () => console.log('Connected to signaling server');

      socket.onmessage = async (event) => {
        const message = JSON.parse(event.data);

        if (message.type === 'init') {
          clientId = message.id;
          document.getElementById('clientIdDisplay').textContent = `Your ID: ${clientId}`;
          populateContacts();
        } else if (message.type === 'offer') {
          await handleOffer(message.data, message.from);
        } else if (message.type === 'answer') {
          await localConnection.setRemoteDescription(new RTCSessionDescription(message.data));
        } else if (message.type === 'ice-candidate') {
          try {
            await localConnection.addIceCandidate(message.data);
          } catch (e) {
            console.error('Error adding received ICE candidate', e);
          }
        }
      };
    }

    function createConnection() {
      localConnection = new RTCPeerConnection({
        iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
      });

      dataChannel = localConnection.createDataChannel("chat");
      setupDataChannel(dataChannel);

      localConnection.onicecandidate = (event) => {
        if (event.candidate) {
          socket.send(JSON.stringify({
            type: 'ice-candidate',
            data: event.candidate,
            target: currentTargetId
          }));
        }
      };

      localConnection.ondatachannel = (event) => {
        setupDataChannel(event.channel);
      };

      localConnection.onconnectionstatechange = () => {
        connectionStatus.textContent = localConnection.connectionState;
      };
    }

    function setupDataChannel(channel) {
      dataChannel = channel;
      dataChannel.onopen = () => {
        console.log('Data channel open');
        connectionStatus.textContent = 'Connected';
      };
      dataChannel.onmessage = (event) => {
        const message = { sender: 'Peer', text: event.data };
        messages.push(message);
        renderMessages();
      };
    }

    async function sendMessage() {
      const text = messageInput.value.trim();
      if (!text || !dataChannel || dataChannel.readyState !== 'open') return;

      const message = { sender: 'You', text };
      dataChannel.send(text);
      messages.push(message);
      renderMessages();
      messageInput.value = '';
    }

    async function createOffer() {
      createConnection();

      const offer = await localConnection.createOffer();
      await localConnection.setLocalDescription(offer);

      socket.send(JSON.stringify({
        type: 'offer',
        data: offer,
        target: currentTargetId
      }));
    }

    async function handleOffer(offer, fromId) {
      currentTargetId = fromId;
      createConnection();

      await localConnection.setRemoteDescription(new RTCSessionDescription(offer));
      const answer = await localConnection.createAnswer();
      await localConnection.setLocalDescription(answer);

      socket.send(JSON.stringify({
        type: 'answer',
        data: answer,
        target: currentTargetId
      }));
    }

    function populateContacts() {
      const contacts = [
        { name: 'Tab A (You)', id: clientId },
        { name: 'Tab B (Peer)', id: '' }
      ];

      contactsList.innerHTML = contacts.map(contact => `
        <div 
          class="contact-item flex items-center gap-3 p-2 hover:bg-gray-700 rounded cursor-pointer"
          data-name="${contact.name}" 
          data-id="${contact.id}"
        >
          <div class="w-8 h-8 bg-blue-500 rounded-full flex items-center justify-center">
            <span class="text-white text-sm">${contact.name.charAt(0)}</span>
          </div>
          <div class="flex-1">
            <div class="text-sm font-medium">${contact.name}</div>
          </div>
        </div>
      `).join('');
    }

    contactsList.addEventListener('click', (e) => {
      const contactEl = e.target.closest('.contact-item');
      if (!contactEl) return;

      const id = contactEl.dataset.id;
      if (!id) {
        alert('This contact does not have an ID assigned yet.');
        return;
      }

      currentTargetId = id;
      createOffer();
    });

    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    function renderMessages() {
      messagesContainer.innerHTML = messages.map(msg => `
        <div class="flex ${msg.sender === 'You' ? 'justify-end' : 'justify-start'}">
          <div class="bg-${msg.sender === 'You' ? 'green' : 'gray'}-700 px-4 py-2 rounded-lg">
            <span class="text-sm">${msg.text}</span>
          </div>
        </div>
      `).join('');
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function init() {
      connectToSignalingServer();
    }

    init();
  </script>
</body>
</html>
