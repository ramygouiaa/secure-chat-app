
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SecureChat - Enhanced</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white">
  <div class="flex h-screen">
    <!-- Sidebar -->
    <div class="w-80 bg-gray-800 border-r border-gray-700 flex flex-col">
      <div class="p-4 border-b border-gray-700">
        <div class="flex items-center justify-between">
          <h1 class="text-xl font-bold text-green-400">SecureChat</h1>
          <div class="flex items-center gap-2">
            <div class="w-3 h-3 bg-green-500 rounded-full" title="E2E Encryption Active"></div>
            <button id="voiceObfuscationBtn" class="px-3 py-1 bg-purple-600 hover:bg-purple-700 rounded text-sm">🎭 Voice Mode</button>
          </div>
        </div>
      </div>
      <div class="p-3 bg-gray-700 border-b border-gray-600">
        <div class="flex items-center gap-2 text-sm">
          <span class="text-green-400">🔐</span>
          <span id="keyStatus" class="text-green-400">Initializing...</span>
        </div>
        <div id="clientIdDisplay" class="text-xs text-gray-400 mt-2"></div>
      </div>
      <div class="flex-1 overflow-y-auto">
        <div class="p-2">
          <div class="text-sm text-gray-400 mb-2">Contacts</div>
          <div id="contactsList" class="space-y-1"></div>
        </div>
      </div>
    </div>

    <!-- Main Chat Area -->
    <div class="flex-1 flex flex-col">
      <div class="p-4 bg-gray-800 border-b border-gray-700">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-blue-500 rounded-full flex items-center justify-center">
              <span class="text-white font-semibold">A</span>
            </div>
            <div>
              <div class="font-medium">Alice</div>
              <div class="text-sm text-gray-400">Online • End-to-end encrypted</div>
              <div id="callStatus" class="text-xs text-green-400"></div>
            </div>
          </div>
          <div class="flex items-center gap-2">
            <button id="voiceCallBtn" class="p-2 hover:bg-gray-700 rounded" title="Start Voice Call">🎤</button>
            <button id="videoCallBtn" class="p-2 hover:bg-gray-700 rounded" title="Establish P2P Connection">🔗</button>
          </div>
        </div>
      </div>

      <!-- Messages -->
      <div id="messagesContainer" class="flex-1 overflow-y-auto p-4 space-y-4"></div>

      <!-- Message Input -->
      <div class="p-4 bg-gray-800 border-t border-gray-700">
        <div class="flex items-center gap-2">
          <input type="text" id="messageInput" placeholder="Type a secure message..."
            class="flex-1 bg-gray-700 text-white px-4 py-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500"/>
          <button id="sendBtn" class="px-4 py-2 bg-green-600 hover:bg-green-700 rounded-lg">Send</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let socket = null;
    let clientId = null;
    let currentTargetId = null;
    let peers = {};
    let messages = [];
    let currentContact = 'Alice';

    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const messagesContainer = document.getElementById('messagesContainer');
    const contactsList = document.getElementById('contactsList');

    function connectToSignalingServer() {
      socket = new WebSocket('ws://localhost:3000');

      socket.onopen = () => console.log('Connected to signaling server');

      socket.onmessage = (event) => {
        const message = JSON.parse(event.data);
        if (message.type === 'init') {
          clientId = message.id;
          document.getElementById('clientIdDisplay').textContent = `Your ID: ${clientId}`;
          populateContacts();
        } else if (message.type === 'offer') {
          alert('Received offer!');
        } else if (message.type === 'answer') {
          alert('Received answer!');
        } else if (message.type === 'ice-candidate') {
          alert('Received ICE candidate!');
        }
      };
    }

    function populateContacts() {
      const contacts = [
        { name: 'Tab A (You)', status: 'online', avatar: 'A', id: clientId },
        { name: 'Tab B (Peer)', status: 'online', avatar: 'B', id: '' }
      ];

      contactsList.innerHTML = contacts.map((contact, index) => {
        if (contact.id) peers[contact.name] = contact.id;
        return `
          <div 
            class="contact-item flex items-center gap-3 p-2 hover:bg-gray-700 rounded cursor-pointer"
            data-name="${contact.name}" 
            data-id="${contact.id}"
          >
            <div class="w-8 h-8 ${index === 0 ? 'bg-blue-500' : 'bg-green-500'} rounded-full flex items-center justify-center">
              <span class="text-white text-sm">${contact.avatar}</span>
            </div>
            <div class="flex-1">
              <div class="text-sm font-medium">${contact.name}</div>
              <div class="text-xs text-gray-400">${contact.status}</div>
            </div>
            <div class="w-2 h-2 bg-green-500 rounded-full"></div>
          </div>
        `;
      }).join('');
    }

    contactsList.addEventListener('click', (e) => {
      const contactEl = e.target.closest('.contact-item');
      if (!contactEl) return;

      const name = contactEl.dataset.name;
      const id = contactEl.dataset.id;

      if (!id) {
        alert('This contact does not have a peer ID yet. Open it in another tab!');
        return;
      }

      currentTargetId = id;
      currentContact = name;

      alert(`Now chatting with: ${name}`);
      // Simulate offer
      socket.send(JSON.stringify({
        type: 'offer',
        data: { test: 'offer data' },
        target: currentTargetId
      }));
    });

    function init() {
      connectToSignalingServer();
    }

    init();
  </script>
</body>
</html>
