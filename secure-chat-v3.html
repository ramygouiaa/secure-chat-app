<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SecureChat - Real Users</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-900 text-white">
    <!-- Notification Container -->
    <div
      id="notification"
      class="hidden fixed top-0 left-0 right-0 p-4 text-white text-center z-50"
    ></div>

    <div class="flex h-screen">
      <!-- Sidebar -->
      <div
        id="sidebar"
        class="w-full md:w-80 bg-gray-800 border-r border-gray-700 flex-col md:flex absolute md:relative h-full z-20 hidden"
      >
        <div
          class="p-4 border-b border-gray-700 flex justify-between items-center"
        >
          <div class="flex items-center">
            <h1 class="text-xl font-bold text-green-400">SecureChat</h1>
            <div
              class="ml-2 w-3 h-3 bg-green-500 rounded-full"
              title="E2E Encryption Active"
            ></div>
          </div>
          <button
            id="closeSidebarBtn"
            class="md:hidden text-gray-400 hover:text-white"
          >
            <svg
              class="w-6 h-6"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M6 18L18 6M6 6l12 12"
              ></path>
            </svg>
          </button>
        </div>
        <div class="p-3 bg-gray-700 border-b border-gray-600">
          <div class="text-sm">
            Your name:
            <span id="displayName" class="font-bold text-green-400"></span>
          </div>
          <div class="text-xs text-gray-400">
            Your ID: <span id="clientIdDisplay"></span>
          </div>
        </div>
        <div class="flex-1 overflow-y-auto">
          <div class="p-2">
            <div class="text-sm text-gray-400 mb-2">Contacts</div>
            <div id="contactsList" class="space-y-1"></div>
          </div>
        </div>
      </div>

      <!-- Main Chat Area -->
      <div class="flex-1 flex flex-col">
        <div class="p-4 bg-gray-800 border-b border-gray-700">
          <div class="flex items-center justify-between">
            <button
              id="openSidebarBtn"
              class="md:hidden text-gray-400 hover:text-white mr-4"
            >
              <svg
                class="w-6 h-6"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M4 6h16M4 12h16m-7 6h7"
                ></path>
              </svg>
            </button>
            <div class="flex-1">
              <div class="font-medium" id="chatWith">Not connected</div>
              <div class="text-sm text-gray-400" id="connectionStatus">
                Disconnected
              </div>
            </div>
          </div>
        </div>

        <!-- Video Call Elements -->
        <div id="videoContainer" class="hidden relative flex-1">
          <video
            id="remoteVideo"
            autoplay
            class="w-full h-full object-cover"
          ></video>
          <video
            id="localVideo"
            autoplay
            muted
            class="absolute bottom-4 right-4 w-48 h-36 border-2 border-white rounded-lg"
          ></video>
        </div>

        <!-- Messages -->
        <div
          id="messagesContainer"
          class="flex-1 overflow-y-auto p-4 space-y-4"
        ></div>

        <!-- Message Input -->
        <div class="p-4 bg-gray-800 border-t border-gray-700">
          <div class="flex items-center gap-2">
            <input
              type="text"
              id="messageInput"
              placeholder="Type a message..."
              class="flex-1 bg-gray-700 text-white px-4 py-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500"
            />
            <button
              id="sendBtn"
              class="px-4 py-2 bg-green-600 hover:bg-green-700 rounded-lg"
            >
              Send
            </button>
            <button
              id="recordBtn"
              class="px-4 py-2 bg-blue-600 hover:bg-blue-700 rounded-lg"
            >
              Record
            </button>
            <button
              id="fileBtn"
              class="px-4 py-2 bg-purple-600 hover:bg-purple-700 rounded-lg"
            >
              Share File
            </button>
            <input type="file" id="fileInput" class="hidden" />
            <button
              id="voiceCallBtn"
              class="px-4 py-2 bg-teal-600 hover:bg-teal-700 rounded-lg"
            >
              Voice Call
            </button>
            <button
              id="videoCallBtn"
              class="px-4 py-2 bg-pink-600 hover:bg-pink-700 rounded-lg"
            >
              Video Call
            </button>
            <button
              id="hangUpBtn"
              class="hidden px-4 py-2 bg-red-600 hover:bg-red-700 rounded-lg"
            >
              Hang Up
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Incoming Call Modal -->
    <div
      id="incomingCallModal"
      class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50"
    >
      <div class="bg-gray-800 p-8 rounded-lg shadow-xl text-center">
        <h2 class="text-2xl font-bold mb-4">Incoming Video Call</h2>
        <p class="mb-6">
          You have a call from <span id="callerName" class="font-bold"></span>.
        </p>
        <div class="flex justify-center gap-4">
          <button
            id="answerCallBtn"
            class="px-6 py-3 bg-green-600 hover:bg-green-700 rounded-lg"
          >
            Answer
          </button>
          <button
            id="declineCallBtn"
            class="px-6 py-3 bg-red-600 hover:bg-red-700 rounded-lg"
          >
            Decline
          </button>
        </div>
      </div>
    </div>

    <audio id="remoteAudio" autoplay></audio>

    <script src="js/constants.js"></script>
    <script src="js/e2ee.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/webrtc.js"></script>
    <script src="js/signaling.js"></script>
    <script src="js/events.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
